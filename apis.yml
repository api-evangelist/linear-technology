aid: linear-technology
name: Linear Technology
description: 'Linear Technology Corporation was an American semiconductor company founded in 1981 by Robert
  H. Swanson Jr. and Robert C. Dobkin and headquartered in Milpitas, California. It designed and manufactured
  high-performance analog integrated circuits across data conversion (ADCs and DACs), signal conditioning
  (operational amplifiers, comparators, voltage references), power management (switching and linear regulators,
  battery management, LED drivers), interface (RS232, RS485), radio frequency, oscillators, and space and
  military ICs, shipping a catalog of more than 7,500 products. Analog Devices agreed to acquire Linear
  Technology in July 2016 in a cash-and-stock deal valued at approximately $14.8 billion, and the acquisition
  closed on March 10, 2017. Linear Technology no longer operates as an independent company: the linear.com
  domain permanently redirects to Analog Devices, and the Linear name survives only as the "Power by Linear"
  product brand. Linear Technology publishes no independent developer portal, documentation, or API surface
  of its own; its developer-facing successor in this network is analog-devices.'
